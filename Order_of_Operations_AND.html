" y2="95" stroke="#262626" stroke-width="22" stroke-linecap="round"></line><line x1="412.9184" y1="95" x2="558.852" y2="95" stroke="#262626" stroke-width="22" stroke-linecap="round"></line><line x1="641.148" y1="95" x2="870" y2="95" stroke="#262626" stroke-width="22" stroke-linecap="round"></line></g><g><line x1="-62.484" y1="95" x2="147.0816" y2="95" stroke="#ffffd7" stroke-width="8.9" stroke-linecap="round"></line><line stroke="url(#wg0)" stroke-width="8.9" stroke-linecap="round" visibility="hidden"></line><line stroke="url(#wg1)" stroke-width="8.9" stroke-linecap="round" visibility="hidden"></line><line stroke="url(#wg2)" stroke-width="8.9" stroke-linecap="round" visibility="hidden"></line><line stroke="url(#wg3)" stroke-width="8.9" stroke-linecap="round" visibility="hidden"></line></g><g><g class="dev" tabindex="0" role="button" aria-label="A Button"><rect x="147.0816" y="62.0816" width="65.8368" height="65.8368" rx="10.974994559999999" fill="url(#gWell)" stroke="#FF0032" stroke-width="1.8"></rect><g transform=""><rect x="158.0544" y="73.0544" width="43.8912" height="43.8912" rx="7.316663039999999" fill="#FF0032" stroke="#1d2733" stroke-width="1.2" filter="url(#fShadow)"></rect><rect x="158.0544" y="73.0544" width="43.8912" height="43.8912" rx="7.316663039999999" fill="url(#gGloss)"></rect><text x="180" y="101.6" text-anchor="middle" class="devtext" font-size="19" style="fill: rgba(28, 28, 28, 0.85);">A</text></g></g><g class="dev" tabindex="0" role="button" aria-label="B Button"><rect x="347.0816" y="62.0816" width="65.8368" height="65.8368" rx="10.974994559999999" fill="url(#gWell)" stroke="#0070C0" stroke-width="1.8"></rect><g transform=""><rect x="358.0544" y="73.0544" width="43.8912" height="43.8912" rx="7.316663039999999" fill="#0070C0" stroke="#1d2733" stroke-width="1.2" filter="url(#fShadow)"></rect><rect x="358.0544" y="73.0544" width="43.8912" height="43.8912" rx="7.316663039999999" fill="url(#gGloss)"></rect><text x="380" y="101.6" text-anchor="middle <script>
const GEO = {"segs":[{"g":"AB","x1":212.9184,"y1":95,"x2":262.9184,"y2":95,"off":0,"dur":0.1,"fadeIn":true},{"g":"AB","x1":262.9184,"y1":95,"x2":347.0816,"y2":95,"off":0.1,"dur":0.1683},{"g":"BX","x1":412.9184,"y1":95,"x2":558.852,"y2":95,"off":0,"dur":0.2919},{"g":"XNEUT","x1":641.148,"y1":95,"x2":870,"y2":95,"off":0,"dur":0.4577}],"groups":[{"name":"AB","init":false,"feeds":[{"dev":0,"src":-1,"tap":0}]},{"name":"BX","init":false,"feeds":[{"dev":1,"src":0,"tap":0.26832639999999996}]},{"name":"XNEUT","init":false,"feeds":[{"dev":2,"src":1,"tap":0.29186719999999994}]}],"devices":[{"key":"PBA","kind":"btn","owner":-1,"nc":false,"maintained":true,"color":"#FF0032","caption":"A Button","text":"A","x":180,"y":95},{"key":"PBB","kind":"btn","owner":-1,"nc":false,"maintained":true,"color":"#0070C0","caption":"B Button","text":"B","x":380,"y":95},{"key":"XCOIL","kind":"coil","owner":-1,"nc":false,"color":"#FFDC00","caption":"X Coil","text":"X","x":600,"y":95}],"coils":{"2":{"g":1,"tap":0.29186719999999994}},"passBox":0.1316736,"passCoil":0.164592,"size":{"box":65.8368,"conH":53.986176,"coil":82.296,"coilIn":60.3504,"btnIn":43.8912,"blW":73.73721599999999,"blH":11.850624},"src":{"x1":-62.484,"x2":147.0816,"y":95},"rails":[{"t":"L1","x":12,"y":55},{"t":"L2","x":752,"y":104}],"view":{"w":800,"h":172}};

/* ---------------- timing (seconds of circuit time) ---------------- */
const CT = 0.2;          // contacts start to move this long after their coil changes
const SWING = 0.4;       // time for a contact blade to swing
const HOLD_EXTRA = 0.5;  // a clicked button stays down this long after everything settles
const OPEN_LIFT = 15;    // how far the contact bar lifts off the posts when open
const GREY = '#404040', BLADE_GREY = '#a6a6a6';
const NG = GEO.groups.length, ND = GEO.devices.length;
const DEV = GEO.devices;
const passOf = d => d < 0 ? 0 : (DEV[d].kind === 'coil' ? GEO.passCoil : GEO.passBox);
const groupLen = GEO.groups.map((g, i) => Math.max(0, ...GEO.segs.filter(s => s.g === g.name).map(s => s.off + s.dur)));
const gIndex = Object.fromEntries(GEO.groups.map((g, i) => [g.name, i]));
const coilOf = {};      // coil device -> {g, tap}
for (const [d, c] of Object.entries(GEO.coils)) coilOf[+d] = c;

const STOPDEV = DEV.find(d => d.key === 'STOP');
const RED = STOPDEV ? STOPDEV.color : '#ff0032';   // current straight from STOP is red
// the current is drawn a little lighter than the button it came from
const LIGHTEN = 0.2;
const FLOW = DEV.map(d => okHex(d.color, '#ffffff', LIGHTEN));
const OFF_WHITE = '#ffffd7';   // "egg": supply from L1, and the return side of each coil out to L2
// colour of current that has not come through a coloured pushbutton: red after STOP,
// or plain egg in circuits where the supply goes straight to the pushbuttons
const FLOW_RED = GEO.plainEgg ? OFF_WHITE : okHex(RED, '#ffffff', LIGHTEN);
const EGG_RAMP = 0.1;   // seconds of wire (under one button width) for egg to turn into the button's colour
// wire groups on the far side of a coil (coil -> L2): they fade from the coil's colour back to off-white
const NEUT = GEO.groups.map(g => g.feeds.some(f => f.dev >= 0 && DEV[f.dev].kind === 'coil'));

/* Current that has come through a pressed pushbutton carries that button's colour: it shades
   from red at the button to the button's colour by the time it reaches the coil.  Work out, for
   each pushbutton, how far along that path every wire group starts, and the length of the path. */
const isPB = d => d >= 0 && DEV[d].kind === 'btn' && DEV[d].key !== 'STOP';
const T0 = {}, TTOT = {};
DEV.forEach((d, b) => {
  if (!isPB(b)) return;
  const m = {};
  GEO.groups.forEach((g, i) => g.feeds.forEach(f => { if (f.dev === b) m[i] = 0; }));
  for (let pass = 0; pass < 4; pass++) GEO.groups.forEach((g, i) => g.feeds.forEach(f => {
    if (f.src >= 0 && f.src in m && !isPB(f.dev)) {
      const c = m[f.src] + f.tap + passOf(f.dev);
      if (!(i in m) || c < m[i]) m[i] = c;
    }
  }));
  T0[b] = m;
  let tot = Infinity;
  for (const c in coilOf) if (coilOf[c].g in m) tot = Math.min(tot, m[coilOf[c].g] + coilOf[c].tap);
  TTOT[b] = isFinite(tot) ? tot : 1;
});


/* ---------------- simulation ----------------
   Every wire group and device keeps a short history of when it changed.  A change travels
   outward: the next device sees it after the current has run along the wire to it, a coil
   picks up / drops out when its feed changes, its contacts follow CT later, and a closing
   contact passes current once the blade has landed. */
let simT, gHist, tHist, dHist, coilOn, swing, queue, seq, btn, busyUntil, autoRelease;

function reset() {
  simT = 0; queue = []; seq = 0; busyUntil = 0; autoRelease = {};
  btn = new Array(ND).fill(false);
  coilOn = new Array(ND).fill(false);
  dHist = DEV.map((d, i) => [{ t: -1e9, on: initialCond(i) }]);
  swing = DEV.map((d, i) => ({ t0: -1e9, closing: d.kind === 'con' ? d.nc : false }));
  gHist = GEO.groups.map(() => [{ t: -1e9, lit: false }]);
  GEO.groups.forEach((g, i) => { gHist[i][0].lit = !!g.init; });   // e.g. the supply side starts live
  tHist = GEO.groups.map(() => [{ t: -1e9, tint: -1 }]);   // -1 = plain red; otherwise the pushbutton it came through
}
function initialCond(i) {
  const d = DEV[i];
  if (d.kind === 'btn') return d.key === 'STOP';
  if (d.kind === 'con') return d.nc;
  return false;
}
const EPS = 1e-7;
function at(hist, t) { let v = hist[0]; for (const h of hist) { if (h.t <= t + EPS) v = h; else break; } return v; }
function last(hist) { return hist[hist.length - 1]; }
function push(hist, e) { hist.push(e); if (hist.length > 12) hist.splice(1, hist.length - 12); }

function schedule(t, fn) { queue.push({ t, s: seq++, fn }); }

function feedOn(g, f, t) {
  let on = true;
  if (f.dev >= 0) on = at(dHist[f.dev], t - (DEV[f.dev].kind === 'coil' ? passOf(f.dev) : 0)).on;
  if (on && f.src >= 0) on = at(gHist[f.src], t - passOf(f.dev) - f.tap).lit;
  return on;
}
function checkGroup(g, t) {
  const now = GEO.groups[g].feeds.some(f => feedOn(g, f, t));
  // which pressed pushbuttons this current has come through; where branches from
  // different buttons meet, it carries all of them and is drawn as their mixture
  const srcs = new Set();
  if (now) for (const f of GEO.groups[g].feeds) {
    if (!feedOn(g, f, t)) continue;
    if (isPB(f.dev)) srcs.add(f.dev);
    else if (f.src >= 0) tintParts(at(tHist[f.src], t - passOf(f.dev) - f.tap).tint).forEach(x => srcs.add(x));
  }
  const tint = srcs.size === 0 ? -1 : srcs.size === 1 ? [...srcs][0] : [...srcs].sort((a, b) => a - b).join('|');
  const litChange = now !== last(gHist[g]).lit;
  const tintChange = now && tint !== last(tHist[g]).tint;
  if (!litChange && !tintChange) return;
  if (litChange) push(gHist[g], { t, lit: now });
  if (tintChange) push(tHist[g], { t, tint });   // the new colour travels along like the current
  busyUntil = Math.max(busyUntil, t + groupLen[g]);
  GEO.groups.forEach((g2, i) => g2.feeds.forEach(f => {
    if (f.src === g) schedule(t + f.tap + passOf(f.dev), () => checkGroup(i, simTEvent));
  }));
  for (const c in coilOf) if (coilOf[c].g === g) schedule(t + coilOf[c].tap, () => checkCoil(+c, simTEvent));
}
function deviceChanged(d, t, on) {
  if (last(dHist[d]).on === on) return;
  push(dHist[d], { t, on });
  const extra = DEV[d].kind === 'coil' ? passOf(d) : 0;
  GEO.groups.forEach((g2, i) => g2.feeds.forEach(f => {
    if (f.dev === d) schedule(t + extra, () => checkGroup(i, simTEvent));
  }));
}
function checkCoil(c, t) {
  const v = at(gHist[coilOf[c].g], t - coilOf[c].tap).lit;
  if (v === coilOn[c]) return;
  coilOn[c] = v;
  deviceChanged(c, t, v);
  busyUntil = Math.max(busyUntil, t + 0.5);
  DEV.forEach((k, i) => { if (k.kind === 'con' && k.owner === c) schedule(t + CT, () => moveContact(i, simTEvent)); });
}
function moveContact(k, t) {
  const want = coilOn[DEV[k].owner] !== DEV[k].nc;
  if (swing[k].closing === want) return;
  swing[k] = { t0: t, closing: want };
  busyUntil = Math.max(busyUntil, t + SWING);
  if (want) schedule(t + SWING, () => { if (swing[k].closing) deviceChanged(k, simTEvent, true); });
  else deviceChanged(k, t, false);
}
function setButton(i, down) {
  if (btn[i] === down) return;
  btn[i] = down;
  deviceChanged(i, simT, DEV[i].key === 'STOP' ? !down : down);
  busyUntil = Math.max(busyUntil, simT);
}

let simTEvent = 0;
function runEvents(upTo) {
  for (let guard = 0; guard < 5000; guard++) {
    if (!queue.length) return;
    let bi = 0;
    for (let i = 1; i < queue.length; i++) {
      const a = queue[i], b = queue[bi];
      if (a.t < b.t - EPS || (Math.abs(a.t - b.t) <= EPS && a.s < b.s)) bi = i;
    }
    if (queue[bi].t > upTo) return;
    const ev = queue.splice(bi, 1)[0];
    simTEvent = ev.t;
    ev.fn();
  }
}

/* ---------------- drawing ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
svg.innerHTML = '';   // remove the still picture that shows when scripts are blocked
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
const S = GEO.size;

const defs = el('defs', {});
defs.innerHTML = `
  <linearGradient id="gWell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#1f1f1f"/></linearGradient>
  <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
  <radialGradient id="gDome" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
  <filter id="fShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.2" flood-color="#000" flood-opacity=".55"/></filter>`;

const layers = { base: el('g', {}), lit: el('g', {}), dev: el('g', {}), text: el('g', {}) };

// supply from L1 to STOP
// always-live supply wiring from L1 (one straight line, or several when it branches)
const supply = (GEO.supply || []).concat(GEO.src ? [{ x1: GEO.src.x1, y1: GEO.src.y, x2: GEO.src.x2, y2: GEO.src.y }] : []);
for (const w of supply) el('line', { x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2, stroke: '#262626', 'stroke-width': 22, 'stroke-linecap': 'round' }, layers.base);
for (const w of supply) el('line', { x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2, stroke: OFF_WHITE, 'stroke-width': 8.9, 'stroke-linecap': 'round' }, layers.lit);

let segIdx = 0;
const segEls = GEO.segs.map(s => {
  el('line', { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: '#262626', 'stroke-width': 22, 'stroke-linecap': 'round' }, layers.base);
  const i = segIdx++;
  const gr = el('linearGradient', { id: 'wg' + i, gradientUnits: 'userSpaceOnUse', x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2 }, defs);
  const stops = [0, 1, 2, 3, 4, 5].map(() => el('stop', { offset: 0, 'stop-color': FLOW_RED }, gr));
  return { s, g: gIndex[s.g], stops, key: '', e: el('line', { stroke: `url(#wg${i})`, 'stroke-width': 8.9, 'stroke-linecap': 'round' }, layers.lit) };
});

function octagon(cx, cy, w) {
  const h = w / 2, c = w * 0.29289;
  return [[-h + c, -h], [h - c, -h], [h, -h + c], [h, h - c], [h - c, h], [-h + c, h], [-h, h - c], [-h, -h + c]]
    .map(([x, y]) => `${(cx + x).toFixed(2)},${(cy + y).toFixed(2)}`).join(' ');
}
function caption(txt, x, y) { const t = el('text', { x, y, 'text-anchor': 'middle', class: 'cap' }, layers.text); t.textContent = txt; }

const view = DEV.map((d, i) => {
  const v = { d };
  const g = el('g', {}, layers.dev);
  if (d.kind === 'btn') {
    const B = S.box, I = S.btnIn;
    g.setAttribute('class', 'dev'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', d.caption);
    if (d.key === 'STOP') {
      el('polygon', { points: octagon(d.x, d.y, B), fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
      v.press = el('g', {}, g);
      v.fill = el('polygon', { points: octagon(d.x, d.y, I), fill: d.color, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, v.press);
      el('polygon', { points: octagon(d.x, d.y, I), fill: 'url(#gGloss)' }, v.press);
    } else {
      el('rect', { x: d.x - B / 2, y: d.y - B / 2, width: B, height: B, rx: B * .1667, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
      v.press = el('g', {}, g);
      v.fill = el('rect', { x: d.x - I / 2, y: d.y - I / 2, width: I, height: I, rx: I * .1667, fill: d.color, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, v.press);
      el('rect', { x: d.x - I / 2, y: d.y - I / 2, width: I, height: I, rx: I * .1667, fill: 'url(#gGloss)' }, v.press);
    }
    const big = d.text.length === 1;   // single-letter pushbuttons get a larger face label
    const t = el('text', { x: d.x, y: d.y + (big ? 6.6 : 4), 'text-anchor': 'middle', class: 'devtext', 'font-size': big ? 19 : 11.5 }, v.press);
    t.textContent = d.text; v.text = t;
    caption(d.caption, d.x, d.y + B / 2 + 2 + 12);
    bindButton(g, i);
  } else if (d.kind === 'con') {
    const B = S.box, H = S.conH;
    el('rect', { x: d.x - B / 2, y: d.y - H / 2, width: B, height: H, rx: H * .1667, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
    v.posts = el('g', {}, g);
    const sy = B * .045, r = B * .105, L = d.x - B / 2;
    const inset = 4.5;   // keep the lead-in stubs clear of the coloured border
    el('rect', { x: L + inset, y: d.y - sy, width: B * .25 - inset, height: 2 * sy }, v.posts);
    el('rect', { x: L + B * .75, y: d.y - sy, width: B * .25 - inset, height: 2 * sy }, v.posts);
    el('circle', { cx: L + B * .25, cy: d.y, r }, v.posts);
    el('circle', { cx: L + B * .75, cy: d.y, r }, v.posts);
    const gl = el('g', { fill: 'url(#gDome)' }, g);
    el('circle', { cx: L + B * .25, cy: d.y, r }, gl);
    el('circle', { cx: L + B * .75, cy: d.y, r }, gl);
    // bridging bar: spans both posts and lifts straight up to open
    const bx1 = L + B * .25 - r * 1.15, bx2 = L + B * .75 + r * 1.15, bh = 7;
    v.blade = el('g', {}, g);
    v.bladeShape = el('rect', { x: bx1, y: d.y - bh / 2, width: bx2 - bx1, height: bh, rx: bh / 2, stroke: 'rgba(0,0,0,.35)', 'stroke-width': .6 }, v.blade);
    el('rect', { x: bx1, y: d.y - bh / 2, width: bx2 - bx1, height: bh, rx: bh / 2, fill: 'url(#gGloss)' }, v.blade);
    g.insertBefore(v.blade, v.posts);   // bar sits behind the contact points
    caption(d.caption, d.x, d.y + H / 2 + 3 + 12);
  } else {
    const C = S.coil, I = S.coilIn;
    el('circle', { cx: d.x, cy: d.y, r: C / 2, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
    v.fill = el('circle', { cx: d.x, cy: d.y, r: I / 2, fill: GREY, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, g);
    el('circle', { cx: d.x, cy: d.y, r: I / 2, fill: 'url(#gDome)' }, g);
    const t = el('text', { x: d.x, y: d.y + 7.5, 'text-anchor': 'middle', class: 'devtext', 'font-size': 21 }, g);
    t.textContent = d.text; v.text = t;
    caption(d.caption, d.x, d.y + C / 2 + 2 + 12);
  }
  return v;
});

for (const r of GEO.rails) { const t = el('text', { x: r.x, y: r.y + 21, class: 'rail' }, layers.text); t.textContent = r.t; }

// status lights, one per coil
const COILS = DEV.map((d, i) => d.kind === 'coil' ? i : -1).filter(i => i >= 0);
const statusDot = {};
for (const c of COILS) {
  const sp = document.createElement('span'), b = document.createElement('b');
  sp.append(b, DEV[c].text); document.getElementById('status').append(sp); statusDot[c] = b;
}
// the Click / Press-and-hold choice only matters for momentary pushbuttons
if (!DEV.some(d => d.kind === 'btn' && d.key !== 'STOP' && !d.maintained)) document.getElementById('mode-group').hidden = true;

// Reset sits with the other controls under the diagram
document.getElementById('reset-btn').addEventListener('click', reset);

/* ---------------- input ---------------- */
let mode = 'click', speed = 1;
function bindButton(g, i) {
  const down = () => {
    if (DEV[i].maintained) { setButton(i, !btn[i]); return; }   // maintained: push on, push again for off
    if (mode === 'click') { if (btn[i]) return; setButton(i, true); autoRelease[i] = true; }
    else setButton(i, true);
  };
  const up = () => { if (mode === 'hold' && !DEV[i].maintained) setButton(i, false); };
  g.addEventListener('pointerdown', e => { e.preventDefault(); try { g.setPointerCapture(e.pointerId); } catch (_) {} down(); });
  g.addEventListener('pointerup', up);
  g.addEventListener('pointercancel', up);
  g.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); down(); } });
  g.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') up(); });
}
function pick(attr, val, set) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === val)));
  set(val);
}
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => pick('speed', b.dataset.speed, v => speed = +v)));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => pick('mode', b.dataset.mode, v => {
  mode = v;
  for (let i = 0; i < ND; i++) if (btn[i] && !DEV[i].maintained) setButton(i, false);
  autoRelease = {};
})));

/* ---------------- frame ---------------- */
function lerp(a, b, f) { return a + (b - a) * f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function draw() {
  for (const v of segEls) {
    const { s } = v, h = gHist[v.g];
    let c = h[0];
    for (const e of h) { if (e.t + s.off <= simT + EPS) c = e; else break; }
    const p = c.t < -1e8 ? 1 : clamp01((simT - c.t - s.off) / s.dur);
    const a = c.lit ? 0 : p, b = c.lit ? p : 1;
    if (b - a < 0.002) { v.e.setAttribute('visibility', 'hidden'); continue; }
    v.e.setAttribute('visibility', 'visible');
    v.e.setAttribute('x1', lerp(s.x1, s.x2, a)); v.e.setAttribute('y1', lerp(s.y1, s.y2, a));
    v.e.setAttribute('x2', lerp(s.x1, s.x2, b)); v.e.setAttribute('y2', lerp(s.y1, s.y2, b));
    paintSegment(v);
  }
  view.forEach((v, i) => {
    const d = v.d;
    if (d.kind === 'btn') {
      const pressed = btn[i];
      v.fill.setAttribute('fill', pressed ? GREY : d.color);
      v.text.style.fill = (pressed ? LIGHT_TEXT : DARK_TEXT);   // dark lettering while lit, light on grey
      v.press.setAttribute('transform', pressed ? `translate(${d.x} ${d.y}) scale(.93) translate(${-d.x} ${-d.y})` : '');
    } else if (d.kind === 'con') {
      const sw = swing[i], f = clamp01((simT - sw.t0) / SWING);
      const e = f * f * (3 - 2 * f);   // ease in and out
      const lift = sw.closing ? lerp(OPEN_LIFT, 0, e) : lerp(0, OPEN_LIFT, e);
      const shut = sw.closing && f >= 1;
      v.blade.setAttribute('transform', `translate(0 ${(-lift).toFixed(2)})`);
      v.bladeShape.setAttribute('fill', shut ? d.color : BLADE_GREY);
      v.posts.setAttribute('fill', shut ? d.color : GREY);
    } else {
      const h = dHist[i], c = last(h);
      const f = c.t < -1e8 ? 1 : clamp01((simT - c.t) / 0.5);
      v.fill.setAttribute('fill', c.on ? mix(GREY, d.color, f) : mix(d.color, GREY, f));
      v.text.style.fill = ((c.on ? f > .5 : f < .5) ? DARK_TEXT : LIGHT_TEXT);
    }
  });
  for (const c of COILS) statusDot[c].style.background = coilOn[c] ? DEV[c].color : '#555';
}
// colour of the current at fraction `fr` along segment s of group g, for a given source
function tintColour(tint, g, s, fr) {
  // the first wire out of the supply side shades from off-white into the current's colour
  if (s.fadeIn) return mixOk(OFF_WHITE, plainColour(tint, g, s, fr), fr);
  return plainColour(tint, g, s, fr);
}
// -1 = plain, a number = one pushbutton, "a|b" = several pushbuttons' current mixed together
function tintParts(t) { return t === -1 ? [] : typeof t === 'number' ? [t] : String(t).split('|').map(Number); }
function blend(cols) { let c = cols[0]; for (let i = 1; i < cols.length; i++) c = mixOk(c, cols[i], 1 / (i + 1)); return c; }
function plainColour(tint, g, s, fr) {
  const parts = tintParts(tint);
  if (parts.length > 1) return blend(parts.map(p => plainColour(p, g, s, fr)));
  if (NEUT[g]) {
    const into = tint < 0 ? FLOW_RED : FLOW[tint];
    return mixOk(into, OFF_WHITE, clamp01((s.off + fr * s.dur) / groupLen[g]));
  }
  if (tint < 0) return FLOW_RED;
  const base = T0[tint][g];
  if (base === undefined) return FLOW[tint];
  // from plain egg, the button's colour takes over quickly, just past the button;
  // from red (after STOP) it blends gradually all the way to the coil
  const span = GEO.plainEgg ? EGG_RAMP : TTOT[tint];
  return mixOk(FLOW_RED, FLOW[tint], clamp01((base + s.off + fr * s.dur) / span));
}
function paintSegment(v) {
  const { s, g } = v, h = tHist[g];
  let k = 0;
  for (let j = 0; j < h.length; j++) { if (h[j].t + s.off <= simT + EPS) k = j; else break; }
  const nw = h[k].tint;
  // if the group was dark when this colour arrived, there is no older colour ahead of it
  // (otherwise the round end of the wire would show a red tip)
  const wasLit = k > 0 && at(gHist[g], h[k].t - 1e-4).lit;
  const old = wasLit ? h[k - 1].tint : nw;
  const q = h[k].t < -1e8 ? 1 : clamp01((simT - h[k].t - s.off) / s.dur);
  let st;
  if (q >= 1 || nw === old) st = [[0, nw], [.5, nw], [1, nw]].map(([o, c]) => [o, tintColour(c, g, s, o)]);
  else st = [[0, tintColour(nw, g, s, 0)], [q, tintColour(nw, g, s, q)], [q, tintColour(old, g, s, q)], [1, tintColour(old, g, s, 1)]];
  const key = st.map(x => x[0].toFixed(3) + x[1]).join('|');
  if (key === v.key) return;
  v.key = key;
  v.stops.forEach((el_, j) => {
    const x = st[Math.min(j, st.length - 1)];
    el_.setAttribute('offset', x[0]); el_.setAttribute('stop-color', x[1]);
  });
}
// blend two colours through OKLab so red-to-green does not turn muddy in the middle
function toLin(c) { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }
function toSrgb(c) { c = c <= .0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - .055; return Math.round(clamp01(c) * 255); }
function oklab(h) {
  let n;
  if (h[0] === '#') n = parseInt(h.slice(1), 16);
  else { const m = h.match(/\d+/g).map(Number); n = (m[0] << 16) | (m[1] << 8) | m[2]; }   // also takes rgb(...)
  const r = toLin(n >> 16 & 255), g = toLin(n >> 8 & 255), b = toLin(n & 255);
  const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
  return [.2104542553 * l + .793617785 * m - .0040720468 * s, 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .808675766 * s];
}
function okHex(h1, h2, f) { const m = mixOk(h1, h2, f).match(/\d+/g).map(Number); return '#' + m.map(x => x.toString(16).padStart(2, '0')).join(''); }
function mixOk(h1, h2, f) {
  const A = oklab(h1), B = oklab(h2), L = lerp(A[0], B[0], f), a = lerp(A[1], B[1], f), b = lerp(A[2], B[2], f);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const r = toSrgb(4.0767416621 * l - 3.3077115913 * m + .2309699292 * s), g = toSrgb(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s), bb = toSrgb(-.0041960863 * l - .7034186147 * m + 1.707614701 * s);
  return `rgb(${r},${g},${bb})`;
}
// dark lettering on a lit part, light lettering on grey
const DARK_TEXT = 'rgba(28,28,28,.85)', LIGHT_TEXT = 'rgba(242,242,242,.78)';
function isLight(h) { return oklab(h)[0] > .8; }
function mix(h1, h2, f) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  simT += dt * speed;
  runEvents(simT);
  if (mode === 'click') {
    for (const i in autoRelease) {
      if (!queue.length && simT > busyUntil + HOLD_EXTRA) { setButton(+i, false); delete autoRelease[i]; }
    }
  }
  draw();
  requestAnimationFrame(tick);
}
/* Fit the whole simulator in the window (or the Canvas frame) without scrolling:
   the diagram shrinks until the title, diagram and controls all fit in the height available. */
const stageEl = document.querySelector('.stage'), wrapEl = document.querySelector('.wrap');
function fitToWindow() {
  stageEl.style.maxWidth = 'none';
  const others = wrapEl.getBoundingClientRect().height - stageEl.getBoundingClientRect().height;
  const avail = Math.max(220, window.innerHeight - others - 2);
  stageEl.style.maxWidth = (avail * GEO.view.w / GEO.view.h) + 'px';   // the panel shrinks with the diagram
}
window.addEventListener('resize', fitToWindow);
fitToWindow();

reset();
draw();
requestAnimationFrame(tick);
</script>

</body>
</html>
