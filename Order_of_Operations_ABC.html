<title>Order of Operations: ABC</title>
<style>
/* Layout: one dark control-panel page; the ladder diagram is the whole stage, controls in a strip under it. */
:root {
  color-scheme: dark;
  --page: #1c1d1f;          /* around the panel */
  --panel: #404040;         /* diagram background */
  --well: #262626;          /* device boxes and wire channels */
  --ink: #ececec;
  --muted: #bfbfbf;         /* captions */
  --faint: #8d8d8d;
  --gold: #ffc000;          /* live conductor */
  --chip: #2c2d30;
  --chip-on: #4a4b50;
  --line: #3a3b3f;
  --focus: #ffc000;
  --ui: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: auto; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 16px; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--gold); }
.stage { flex: 1 1 auto; min-width: 0; width: 100%; background: var(--panel); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.stage svg { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.group { display: flex; align-items: center; gap: 8px; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.seg { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { font: inherit; font-size: .88rem; color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--ink); }
.seg button:focus-visible, .dev:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap > * { min-width: 0; }
.main { display: flex; gap: 0; align-items: flex-start; justify-content: center; }
/* the table panel slides out from the left: the panel widens while the table glides in from off the edge */
.side { flex: 0 0 auto; width: 0; margin-right: 0; overflow: hidden; transition: width .45s cubic-bezier(.4,0,.2,1), margin .45s cubic-bezier(.4,0,.2,1); }
.side.open { margin-right: 14px; }
.side .status { width: max-content; transform: translateX(-105%); opacity: 0; transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
.side.open .status { transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { .side, .side .status { transition: none; } }
.status { border-collapse: separate; border-spacing: 0; font-size: .86rem; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.status th, .status td { padding: 6px 12px; text-align: left; white-space: nowrap; }
.status thead th { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--faint); border-bottom: 1px solid var(--line); }
.status tr.sec th { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--gold); background: rgba(255,255,255,.03); padding-top: 7px; padding-bottom: 5px; }
.status tbody + tbody tr.sec th { border-top: 1px solid var(--line); }
.status tbody th[scope="row"] { font-weight: 600; color: var(--muted); }
.status td { color: var(--faint); min-width: 4.8em; border-left: 1px solid var(--line); }
.status td.on { color: var(--ink); font-weight: 600; }
.status b { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: #555; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
@media (max-width: 640px) { .status th, .status td { padding: 4px 7px; } }
.reset { font: inherit; font-size: .88rem; font-weight: 600; color: #f2f2f2; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1.4px dashed #9a9a9a; cursor: pointer; }
.reset:hover { background: rgba(255,255,255,.1); }
.toggle { font: inherit; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; background: var(--chip); border: 1px solid var(--line); cursor: pointer; }
.toggle:hover { color: var(--ink); }
.toggle[aria-expanded="true"] { background: var(--chip-on); color: var(--ink); }
.toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.toggle .chev { transition: transform .2s; }
.toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.reset:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* short explanations that appear when the pointer rests on a control */
[data-tip] { position: relative; }
[data-tip]::after { content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 10px); z-index: 5; width: max-content; max-width: min(240px, calc(100vw - 40px)); display: none;
  padding: 7px 10px; border-radius: 6px; background: #111214; color: #ececec; font-size: .8rem; font-weight: 400; line-height: 1.35; text-align: left;
  box-shadow: 0 6px 18px rgba(0,0,0,.45); pointer-events: none; animation: tipIn .15s ease-out .35s both; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { display: block; }
@keyframes tipIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-tip]::after { animation: none; } }
.dev { cursor: pointer; outline: none; }
.cap { font-size: 12.5px; fill: var(--muted); }
.rail { font-size: 20.3px; font-weight: 700; fill: var(--gold); }
.devtext { font-weight: 700; fill: rgba(242,242,242,.78); pointer-events: none; }
@media (max-width: 700px) { .main { flex-direction: column; align-items: stretch; } .side { align-self: center; } .side.open { margin-right: 0; margin-bottom: 14px; } }
@media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
</style>
</head>

// regular hexagon standing on a point (points at top and bottom), corners softly rounded
function hexPath(cx, cy, R, r) {
  const P = [];

      v.press = el('g', {}, g);
      v.fill = el('path', { d: hexPath(d.x, d.y, RI, RI * .17), fill: d.color, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, v.press);
      el('path', { d: hexPath(d.x, d.y, RI, RI * .17), fill: 'url(#gGloss)' }, v.press);
    } else {
      el('rect', { x: d.x - B / 2, y: d.y - B / 2, width: B, height: B, rx: B * .1667, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
      v.press = el('g', {}, g);
      v.fill = el('rect', { x: d.x - I / 2, y: d.y - I / 2, width: I, height: I, rx: I * .1667, fill: d.color, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, v.press);
      el('rect', { x: d.x - I / 2, y: d.y - I / 2, width: I, height: I, rx: I * .1667, fill: 'url(#gGloss)' }, v.press);
    }
    const big = d.text.length === 1;   // single-letter pushbuttons get a larger face label
    const t = el('text', { x: d.x, y: d.y + (big ? 6.6 : 4), 'text-anchor': 'middle', class: 'devtext', 'font-size': big ? 19 : 11.5 }, v.press);
    t.textContent = d.text; v.text = t;
    caption(d.caption, d.x, d.y + B / 2 + 2 + 12 + (d.nc && d.key !== 'STOP' ? 4 : 0));   // clears the hexagon's lower point
    bindButton(g, i);
  } else if (d.kind === 'con') {
    const B = S.box, H = S.conH;
    el('rect', { x: d.x - B / 2, y: d.y - H / 2, width: B, height: H, rx: H * .1667, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
    v.posts = el('g', {}, g);
    const sy = B * .045, r = B * .105, L = d.x - B / 2;
    const inset = 4.5;   // keep the lead-in stubs clear of the coloured border
    el('rect', { x: L + inset, y: d.y - sy, width: B * .25 - inset, height: 2 * sy }, v.posts);
    el('rect', { x: L + B * .75, y: d.y - sy, width: B * .25 - inset, height: 2 * sy }, v.posts);
    el('circle', { cx: L + B * .25, cy: d.y, r }, v.posts);
    el('circle', { cx: L + B * .75, cy: d.y, r }, v.posts);
    const gl = el('g', { fill: 'url(#gDome)' }, g);
    el('circle', { cx: L + B * .25, cy: d.y, r }, gl);
    el('circle', { cx: L + B * .75, cy: d.y, r }, gl);
    // bridging bar: spans both posts and lifts straight up to open
    const bx1 = L + B * .25 - r * 1.15, bx2 = L + B * .75 + r * 1.15, bh = 7;
    v.blade = el('g', {}, g);
    v.bladeShape = el('rect', { x: bx1, y: d.y - bh / 2, width: bx2 - bx1, height: bh, rx: bh / 2, stroke: 'rgba(0,0,0,.35)', 'stroke-width': .6 }, v.blade);
    el('rect', { x: bx1, y: d.y - bh / 2, width: bx2 - bx1, height: bh, rx: bh / 2, fill: 'url(#gGloss)' }, v.blade);
    g.insertBefore(v.blade, v.posts);   // bar sits behind the contact points
    caption(d.caption, d.x, d.y + H / 2 + 3 + 12);
  } else {
    const C = S.coil, I = S.coilIn;
    el('circle', { cx: d.x, cy: d.y, r: C / 2, fill: 'url(#gWell)', stroke: d.color, 'stroke-width': 1.8 }, g);
    v.fill = el('circle', { cx: d.x, cy: d.y, r: I / 2, fill: GREY, stroke: '#1d2733', 'stroke-width': 1.2, filter: 'url(#fShadow)' }, g);
    el('circle', { cx: d.x, cy: d.y, r: I / 2, fill: 'url(#gDome)' }, g);
    const t = el('text', { x: d.x, y: d.y + 7.5, 'text-anchor': 'middle', class: 'devtext', 'font-size': 21 }, g);
    t.textContent = d.text; v.text = t;
    caption(d.caption, d.x, d.y + C / 2 + 2 + 12);
  }
  return v;
});

for (const r of GEO.rails) { const t = el('text', { x: r.x, y: r.y + 21, class: 'rail' }, layers.text); t.textContent = r.t; }

// status readout: every pushbutton (active = pressed in), then every coil (active = energised)
const COILS = DEV.map((d, i) => d.kind === 'coil' ? i : -1).filter(i => i >= 0);
const STATUS = DEV.map((d, i) => d.kind === 'btn' ? i : -1).filter(i => i >= 0).concat(COILS);
const statusEl = {};
for (const i of STATUS) {
  const tr = document.createElement('tr'), th = document.createElement('th'), b = document.createElement('b'), word = document.createElement('td');
  // the component's name as on the diagram, without the (NO)/(NC) note
  const name = DEV[i].text;   // just the letter (inputs and outputs are already in their own sections)
  th.scope = 'row'; th.append(b, name); word.textContent = 'Inactive';   // filled in now so the page can measure its height
  tr.append(th, word);
  document.getElementById(DEV[i].kind === 'coil' ? 'status-out' : 'status-in').append(tr);
  statusEl[i] = { b, word, last: null };
}
// the Click / Press-and-hold choice only matters for momentary pushbuttons
if (!DEV.some(d => d.kind === 'btn' && d.key !== 'STOP' && !d.maintained)) document.getElementById('mode-group').hidden = true;

// Reset sits with the other controls under the diagram
document.getElementById('reset-btn').addEventListener('click', reset);
// the status table starts collapsed; this button opens and closes it
const tableBtn = document.getElementById('table-btn'), sidePanel = document.getElementById('status-panel');
const tableEl = sidePanel.querySelector('.status');
tableBtn.addEventListener('click', () => {
  const open = !sidePanel.classList.contains('open');
  if (open) {
    sidePanel.style.width = tableEl.offsetWidth + 'px';          // widen to exactly the table's width
  } else {
    sidePanel.style.width = sidePanel.offsetWidth + 'px';        // start from the current width...
    void sidePanel.offsetWidth;
    sidePanel.style.width = '0px';                               // ...and close smoothly
  }
  sidePanel.classList.toggle('open', open);
  sidePanel.inert = !open;
  sidePanel.setAttribute('aria-hidden', String(!open));
  tableBtn.setAttribute('aria-expanded', String(open));
  document.getElementById('table-word').textContent = open ? 'Hide table' : 'Show table';
  fitToWindow();
});
// once open, let the panel follow the table if its text changes width (e.g. Active / Inactive)
sidePanel.addEventListener('transitionend', e => {
  if (e.target === sidePanel && e.propertyName === 'width') {
    if (sidePanel.classList.contains('open')) sidePanel.style.width = 'auto';
    fitToWindow();
  }
});

/* ---------------- input ---------------- */
let mode = 'click', speed = 1;
function bindButton(g, i) {
  const down = () => {
    if (DEV[i].maintained) { setButton(i, !btn[i]); return; }   // maintained: push on, push again for off
    if (mode === 'click') { if (btn[i]) return; setButton(i, true); autoRelease[i] = true; }
    else setButton(i, true);
  };
  const up = () => { if (mode === 'hold' && !DEV[i].maintained) setButton(i, false); };
  g.addEventListener('pointerdown', e => { e.preventDefault(); try { g.setPointerCapture(e.pointerId); } catch (_) {} down(); });
  g.addEventListener('pointerup', up);
  g.addEventListener('pointercancel', up);
  g.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); down(); } });
  g.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') up(); });
}
function pick(attr, val, set) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === val)));
  set(val);
}
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => pick('speed', b.dataset.speed, v => speed = +v)));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => pick('mode', b.dataset.mode, v => {
  mode = v;
  for (let i = 0; i < ND; i++) if (btn[i] && !DEV[i].maintained) setButton(i, false);
  autoRelease = {};
})));

/* ---------------- frame ---------------- */
function lerp(a, b, f) { return a + (b - a) * f; }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function draw() {
  for (const v of segEls) {
    const { s } = v, h = gHist[v.g];
    let c = h[0];
    for (const e of h) { if (e.t + s.off <= simT + EPS) c = e; else break; }
    const p = c.t < -1e8 ? 1 : clamp01((simT - c.t - s.off) / s.dur);
    const a = c.lit ? 0 : p, b = c.lit ? p : 1;
    if (b - a < 0.002) { v.e.setAttribute('visibility', 'hidden'); continue; }
    v.e.setAttribute('visibility', 'visible');
    v.e.setAttribute('x1', lerp(s.x1, s.x2, a)); v.e.setAttribute('y1', lerp(s.y1, s.y2, a));
    v.e.setAttribute('x2', lerp(s.x1, s.x2, b)); v.e.setAttribute('y2', lerp(s.y1, s.y2, b));
    paintSegment(v);
  }
  view.forEach((v, i) => {
    const d = v.d;
    if (d.kind === 'btn') {
      const pressed = btn[i];
      if (v.ncLines) {   // NC button: the face stays dark; the sign greys out while pressed
        for (const ln of v.ncLines) ln.setAttribute('stroke', pressed ? '#6a6a6a' : d.color);
      } else v.fill.setAttribute('fill', pressed ? GREY : d.color);
      if (v.fill2) v.fill2.setAttribute('fill', pressed ? GREY : d.color);
      v.text.style.fill = (pressed ? LIGHT_TEXT : DARK_TEXT);   // dark lettering while lit, light on grey
      v.press.setAttribute('transform', pressed ? `translate(${d.x} ${d.y}) scale(.93) translate(${-d.x} ${-d.y})` : '');
    } else if (d.kind === 'con') {
      const sw = swing[i], f = clamp01((simT - sw.t0) / SWING);
      const e = f * f * (3 - 2 * f);   // ease in and out
      const lift = sw.closing ? lerp(OPEN_LIFT, 0, e) : lerp(0, OPEN_LIFT, e);
      const shut = sw.closing && f >= 1;
      v.blade.setAttribute('transform', `translate(0 ${(-lift).toFixed(2)})`);
      v.bladeShape.setAttribute('fill', shut ? d.color : BLADE_GREY);
      v.posts.setAttribute('fill', shut ? d.color : GREY);
    } else {
      const h = dHist[i], c = last(h);
      const f = c.t < -1e8 ? 1 : clamp01((simT - c.t) / 0.5);
      v.fill.setAttribute('fill', c.on ? mix(GREY, d.color, f) : mix(d.color, GREY, f));
      v.text.style.fill = ((c.on ? f > .5 : f < .5) ? DARK_TEXT : LIGHT_TEXT);
    }
  });
  for (const i of STATUS) {
    const on = DEV[i].kind === 'btn' ? btn[i] : coilOn[i], st = statusEl[i];
    if (on === st.last) continue;
    st.last = on;
    st.b.style.background = on ? DEV[i].color : '#555';
    st.word.textContent = on ? 'Active' : 'Inactive';
    st.word.className = on ? 'on' : '';
  }
}
// colour of the current at fraction `fr` along segment s of group g, for a given source
function tintColour(tint, g, s, fr) {
  // the first wire out of the supply side shades from off-white into the current's colour
  if (s.fadeIn) return mixOk(OFF_WHITE, plainColour(tint, g, s, fr), fr);
  return plainColour(tint, g, s, fr);
}
// -1 = plain, a number = one pushbutton, "a|b" = several pushbuttons' current mixed together
function tintParts(t) { return t === -1 ? [] : typeof t === 'number' ? [t] : String(t).split('|').map(Number); }
function blend(cols) { let c = cols[0]; for (let i = 1; i < cols.length; i++) c = mixOk(c, cols[i], 1 / (i + 1)); return c; }
function plainColour(tint, g, s, fr) {
  const parts = tintParts(tint);
  if (parts.length > 1) return blend(parts.map(p => plainColour(p, g, s, fr)));
  if (NEUT[g]) {
    const into = tint < 0 ? FLOW_RED : FLOW[tint];
    return mixOk(into, OFF_WHITE, clamp01((s.off + fr * s.dur) / groupLen[g]));
  }
  if (tint < 0) return FLOW_RED;
  const base = T0[tint][g];
  if (base === undefined) return FLOW[tint];
  // from plain egg, the button's colour takes over quickly, just past the button;
  // from red (after STOP) it blends gradually all the way to the coil
  // (a circuit can ask for a shorter blend, e.g. so parallel branches are full colour before they meet)
  const span = GEO.plainEgg ? EGG_RAMP : (GEO.rampSpan || TTOT[tint]);
  return mixOk(FLOW_RED, FLOW[tint], clamp01((base + s.off + fr * s.dur) / span));
}
function paintSegment(v) {
  const { s, g } = v, h = tHist[g];
  let k = 0;
  for (let j = 0; j < h.length; j++) { if (h[j].t + s.off <= simT + EPS) k = j; else break; }
  const nw = h[k].tint;
  // if the group was dark when this colour arrived, there is no older colour ahead of it
  // (otherwise the round end of the wire would show a red tip)
  const wasLit = k > 0 && at(gHist[g], h[k].t - 1e-4).lit;
  const old = wasLit ? h[k - 1].tint : nw;
  const q = h[k].t < -1e8 ? 1 : clamp01((simT - h[k].t - s.off) / s.dur);
  let st;
  if (q >= 1 || nw === old) st = [[0, nw], [.5, nw], [1, nw]].map(([o, c]) => [o, tintColour(c, g, s, o)]);
  else st = [[0, tintColour(nw, g, s, 0)], [q, tintColour(nw, g, s, q)], [q, tintColour(old, g, s, q)], [1, tintColour(old, g, s, 1)]];
  const key = st.map(x => x[0].toFixed(3) + x[1]).join('|');
  if (key === v.key) return;
  v.key = key;
  v.stops.forEach((el_, j) => {
    const x = st[Math.min(j, st.length - 1)];
    el_.setAttribute('offset', x[0]); el_.setAttribute('stop-color', x[1]);
  });
}
// blend two colours through OKLab so red-to-green does not turn muddy in the middle
function toLin(c) { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }
function toSrgb(c) { c = c <= .0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - .055; return Math.round(clamp01(c) * 255); }
function oklab(h) {
  let n;
  if (h[0] === '#') n = parseInt(h.slice(1), 16);
  else { const m = h.match(/\d+/g).map(Number); n = (m[0] << 16) | (m[1] << 8) | m[2]; }   // also takes rgb(...)
  const r = toLin(n >> 16 & 255), g = toLin(n >> 8 & 255), b = toLin(n & 255);
  const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
  return [.2104542553 * l + .793617785 * m - .0040720468 * s, 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .808675766 * s];
}
function okHex(h1, h2, f) { const m = mixOk(h1, h2, f).match(/\d+/g).map(Number); return '#' + m.map(x => x.toString(16).padStart(2, '0')).join(''); }
function mixOk(h1, h2, f) {
  const A = oklab(h1), B = oklab(h2), L = lerp(A[0], B[0], f), a = lerp(A[1], B[1], f), b = lerp(A[2], B[2], f);
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const r = toSrgb(4.0767416621 * l - 3.3077115913 * m + .2309699292 * s), g = toSrgb(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s), bb = toSrgb(-.0041960863 * l - .7034186147 * m + 1.707614701 * s);
  return `rgb(${r},${g},${bb})`;
}
// dark lettering on a lit part, light lettering on grey
const DARK_TEXT = 'rgba(28,28,28,.85)', LIGHT_TEXT = 'rgba(242,242,242,.78)';
function isLight(h) { return oklab(h)[0] > .8; }
function mix(h1, h2, f) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  simT += dt * speed;
  runEvents(simT);
  if (mode === 'click') {
    for (const i in autoRelease) {
      if (!queue.length && simT > busyUntil + HOLD_EXTRA) { setButton(+i, false); delete autoRelease[i]; }
    }
  }
  draw();
  requestAnimationFrame(tick);
}
/* Fit the whole simulator in the window (or the Canvas frame) without scrolling:
   the diagram shrinks until the title, diagram and controls all fit in the height available. */
const stageEl = document.querySelector('.stage'), wrapEl = document.querySelector('.wrap'), mainEl = document.querySelector('.main');
function fitToWindow() {
  stageEl.style.maxWidth = 'none';
  const others = wrapEl.getBoundingClientRect().height - mainEl.getBoundingClientRect().height
    + (getComputedStyle(mainEl).flexDirection === 'column' && document.querySelector('.side').classList.contains('open') ? document.querySelector('.side').getBoundingClientRect().height + 14 : 0);
  const avail = Math.max(220, window.innerHeight - others - 2);
  stageEl.style.maxWidth = (avail * GEO.view.w / GEO.view.h) + 'px';   // the panel shrinks with the diagram
}
window.addEventListener('resize', fitToWindow);
fitToWindow();
requestAnimationFrame(fitToWindow);   // once more after the first frame, when everything has its final size

reset();
draw();
requestAnimationFrame(tick);
</script>

</body>
</html>
